[project]
name = "tinymod"
version = "0.1.0"
description = "tinygrad's premier discord moderation bot"
authors = [{name = "Woze Parrot", email = "wozeparrot@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "python-dotenv>=1.0.0,<2.0.0",
  "pygithub>=1.59.0,<2.0.0",
  "aiosqlite>=0.19.0,<0.20.0",
  "inotify-simple>=1.3.5,<2.0.0",
  "prettytable>=3.10.0,<4.0.0",
  "tabulate>=0.9.0,<0.10.0",
  "tqdm>=4.66.0,<5.0.0",
  "audioop-lts>=0.2.0; python_version >= '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinymod"]

[tool.uv.extra-build-dependencies]
inotify-simple = ["setuptools"]
